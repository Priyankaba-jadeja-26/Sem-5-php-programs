<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        .main-layout{
            background-color: beige;
            height: 400px;
            width: 50%;
        }
        .operations{
            height: 50px;
            margin-top: 20px;
            margin-left: 20px;
        }
    </style>
</head>
<body>
    <div class="main-layout">
        <div class="input-box">
            
            <span class="box1">
                <label> Number 1 </label>
                <input type="number" id="num1">
            </span>
        
            <span class="box2">
                <label> Number 2 </label>
                <input type="number" id="num2">
            </span>

        </div>

        <div class="operations">
            <span class="sum"><button onclick="sum()">sum</button></span>
            <span class="sub" onclick="sub()"><button>sub</button></span>
            <span class="multiply" onclick="mul()"><button>multiply</button></span>
            <span class="devide" onclick="devide()"><button>devide</button></span>
        </div>

        <div class="ans">
            <label> Answer </label>
            <input type="text" id="ans">
        </div>
    </div>
</body>
<script>

    

    function sum(){
        let num1 = Number(document.getElementById("num1").value);
        let num2 = Number(document.getElementById("num2").value);

        let ans = num1 + num2;

        document.getElementById("ans").value = ans;
    }

    function sub(){
        let num1 = Number(document.getElementById("num1").value);
        let num2 = Number(document.getElementById("num2").value);

        let ans = num1 - num2;

        document.getElementById("ans").value = ans;
    }

    function mul(){
        let num1 = Number(document.getElementById("num1").value);
        let num2 = Number(document.getElementById("num2").value);

        let ans = num1 * num2;

        document.getElementById("ans").value = ans;
    }

    function devide(){
        let num1 = Number(document.getElementById("num1").value);
        let num2 = Number(document.getElementById("num2").value);

        let ans = num1 / num2;

        document.getElementById("ans").value = ans;
    }
    
    
</script>
</html>
